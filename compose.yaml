name: ${CODEX_STACK:?Defina CODEX_STACK}

services:
  codex:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-${CODEX_RUNTIME:-ruby}

    image: codex-isolated:${CODEX_RUNTIME:-ruby}

    working_dir: /workspace
    user: "node"

    stdin_open: true
    tty: true

    read_only: true

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    pids_limit: 128

    networks:
      - codex_internal

    depends_on:
      - proxy

    volumes:
      - type: bind
        source: ${CODEX_WORKSPACE:?Defina CODEX_WORKSPACE}
        target: /workspace
        read_only: true
        bind:
          create_host_path: false

      - type: volume
        source: codex_home
        target: /home/node/.codex

    tmpfs:
      - /tmp:rw,nosuid,size=64m,mode=1777

    environment:
      HOME: /home/node
      CODEX_HOME: /home/node/.codex
      HTTP_PROXY: http://proxy:3128
      HTTPS_PROXY: http://proxy:3128
      http_proxy: http://proxy:3128
      https_proxy: http://proxy:3128
      NO_PROXY: localhost,127.0.0.1
      no_proxy: localhost,127.0.0.1

    command: ["codex", "--version"]

  proxy:
    build:
      context: ./proxy

    read_only: true

    cap_drop:
      - ALL

    cap_add:
      - SETUID
      - SETGID

    security_opt:
      - no-new-privileges:true

    networks:
      - codex_internal
      - proxy_egress

    tmpfs:
      - /tmp:rw,nosuid,size=64m,mode=1777
      - /var/spool/squid:rw,nosuid,size=64m
      - /var/log/squid:rw,nosuid,size=16m,uid=13,gid=13,mode=0750

networks:
  codex_internal:
    internal: true

  proxy_egress:
    driver: bridge

volumes:
  codex_home:
